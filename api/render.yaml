# Render Blueprint for the whole stack (the "wa-aios" Blueprint reads this file —
# its "Blueprint Path" is set to api/render.yaml):
#   wa-aios-api        — Node API (Retell webhooks, booking, CRM/dashboard API)
#   wa-aios-dashboard  — Next.js owner dashboard / CRM
#   wa-aios-db         — Postgres
# rootDir paths below are relative to the repo root regardless of this file's location.

services:
  - type: web
    name: wa-aios-api
    runtime: node
    plan: starter
    buildCommand: cd api && npm ci
    startCommand: cd api && npm run migrate && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: wa-aios-db
          property: connectionString
      - key: DATABASE_SSL
        value: disable
      # Bookings/availability use one shared Google Calendar
      # (tenants.adapter_config.sharedCalendarId = "primary"). The three
      # GOOGLE_OAUTH_* values are entered in the Render dashboard (sync: false);
      # the API refuses to boot in google mode without them.
      - key: CALENDAR_PROVIDER
        value: google
      - key: GOOGLE_OAUTH_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH_CLIENT_SECRET
        sync: false
      - key: GOOGLE_OAUTH_REFRESH_TOKEN
        sync: false
      - key: MIGRATE_SEED
        value: true
      # Instagram/WhatsApp DM follow-ups go out through ManyChat. Enter
      # MANYCHAT_API_KEY (ManyChat -> Settings -> API) in the Render dashboard;
      # enter it in the SAME deploy that sets MESSAGE_TRANSPORT_INSTAGRAM=manychat,
      # otherwise Instagram follow-up messages error instead of staying stubbed.
      # Inbound (/webhook/manychat-lead) needs neither and is already live.
      - key: MANYCHAT_API_KEY
        sync: false
      - key: MESSAGE_TRANSPORT_INSTAGRAM
        value: manychat
      # Real customer email (confirmations, reminders, reschedule/cancel,
      # missed-call + lead follow-ups). Verify a sending domain in Resend, then
      # set RESEND_API_KEY + EMAIL_FROM (+ optional REPLY_TO_EMAIL) below.
      # Until all three are set, /health reports emailAutomation:"not_configured"
      # and email sends fail-and-log without affecting bookings.
      - key: MESSAGE_TRANSPORT_EMAIL
        value: resend
      - key: RESEND_API_KEY
        sync: false
      # EMAIL_FROM: "Salon Name <bookings@your-verified-domain>". Per-salon
      # overrides live in tenants.messaging_config.email.from (dashboard Settings).
      - key: EMAIL_FROM
        sync: false
      - key: REPLY_TO_EMAIL
        sync: false
      # MAIL_FROM: legacy fallback for EMAIL_FROM. Kept for back-compat.
      - key: MAIL_FROM
        sync: false
      # Conversational AI for inbound replies and reactivation copy. Optional:
      # without it inbound threads route to a human and reactivation uses templates.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: AIOS_AI_MODEL
        value: claude-sonnet-5
      # For multi-salon: comma-separated tenant UUIDs the dashboard token may read.
      # Leave unset for a single-salon deployment (serves DEFAULT/TENANT_ID only).
      - key: DASHBOARD_TENANT_IDS
        sync: false
      # ── Two DIFFERENT Retell secrets. Do NOT set them to the same value. ──
      # RETELL_API_KEY: the Retell API key with the "Webhook" badge. Verifies
      #   X-Retell-Signature on the PLATFORM webhook /webhook/retell
      #   (call_started/ended/analyzed). Also used by retell/provision.mjs.
      - key: RETELL_API_KEY
        sync: false
      # RETELL_WEBHOOK_SECRET: the `x-retell-webhook-secret` HEADER value that the
      #   receptionist's TOOL calls send (/webhook/check-availability,
      #   /webhook/book-appointment, …). retell/provision.mjs bakes this exact
      #   string into every tool from the local .env, so the two must match.
      #   generateValue seeds it once; if you rotate it, re-run `npm run retell:sync`.
      - key: RETELL_WEBHOOK_SECRET
        generateValue: true
      - key: DASHBOARD_API_TOKEN
        generateValue: true
      - key: TRUST_PROXY
        value: true
      - key: RATE_LIMIT_MAX
        value: 120
      - key: RATE_LIMIT_WINDOW_MS
        value: 60000

  # The owner dashboard / CRM (Next.js). Talks to wa-aios-api over HTTP with the
  # DASHBOARD_API_TOKEN, which is pulled straight from the API service so the two
  # always match. After a Blueprint sync Render assigns this a public URL
  # (https://wa-aios-dashboard.onrender.com by default).
  - type: web
    name: wa-aios-dashboard
    runtime: node
    # free tier sleeps after 15 min idle (~50s cold start). Change to "starter"
    # for an always-on dashboard.
    plan: free
    rootDir: dashboard
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: AIOS_API_URL
        value: https://wa-aios-api.onrender.com
      - key: DASHBOARD_API_TOKEN
        fromService:
          name: wa-aios-api
          type: web
          envVarKey: DASHBOARD_API_TOKEN
      - key: NEXT_PUBLIC_DEMO_TENANT_ID
        value: 11111111-1111-4111-8111-111111111111
      # Owner login password. Set this in the Render dashboard.
      - key: DASHBOARD_PASSWORD
        sync: false
      - key: DASHBOARD_SESSION_SECRET
        generateValue: true

databases:
  - name: wa-aios-db
    plan: free
